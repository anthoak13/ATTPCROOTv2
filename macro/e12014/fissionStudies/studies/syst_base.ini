; Baseline of the fit systematics study (syst_study/PLAN.md): every input to the simulation at its nominal
; value. Each variation (syst_*.ini) simulates the same sample again with one input changed, using the seeds
; below, and is compared with fit rec.
;
; base: 3000 events, decay angle in the CoM frame uniform over 80-100 deg, light-fragment Z uniform over 31-42
;   (heavy 43-54), one exact split per event. Simulated in more detail than the fit (0.25 mm steps, 4000
;   diffusion points per line), as in the tuning study.
; wide_lo, wide_hi: 750 events each at 60-80 and 100-120 deg (10-30 deg from 90), fitted once, never varied.
;
; Fits: rec (the recommended settings, the defaults below), rec2 (the same with another seed: the fit's own
; scatter) and ref (the reference settings the recommended ones were tested against).
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
digi.intPoints = 4000
digi.seed = 520000
fit.input = base
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0

[sim base]

[digi base]

[fit rec]

[fit rec2]
seed = 540000

[fit ref]
iter = 100
rounds = 2
step = 1
fixedPattern = 0
intPoints = 1000
zSigma = 3
gainFluct = 1

[sim wide_lo]
events = 750
chunks = 15
decayAngleMin = 60
decayAngleMax = 80
seed = 550000

[digi wide_lo]
seed = 560000

[fit wide_lo]
input = wide_lo

[sim wide_hi]
events = 750
chunks = 15
decayAngleMin = 100
decayAngleMax = 120
seed = 570000

[digi wide_hi]
seed = 580000

[fit wide_hi]
input = wide_hi
