; Rebuilt from ../skyler/plots_pdf/SRIM_LISE, LISE_LISE and ../skyler/NOTES.md. Original settings are approximate.
[study]
question = How much does using a different energy-loss table in the fit than in the simulation bias Z?
result   = SRIM sim / LISE fit: sigma = 1.14 with two peaks at +-1. Matched tables are unbiased.

[defaults]
events = 500
sim.zToSim = 50
sim.massDev = 0
sim.decayAngle = 90
fit.iter = 100
fit.rounds = 2
fit.threads = 4

[run lise-lise]
sim.eloss = LISE
fit.eloss = LISE

[run srim-lise]
sim.eloss = SRIM
fit.eloss = LISE

[run srim-srim]
upstream = srim-lise
fit.eloss = SRIM
