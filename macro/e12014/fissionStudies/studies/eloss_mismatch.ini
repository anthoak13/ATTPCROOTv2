; Rebuilt from ../skyler/plots_pdf/SRIM_LISE, LISE_LISE and ../skyler/NOTES.md. Original settings are approximate.
[defaults]
sim.events = 500
sim.zToSim = 50
sim.massDev = 0
sim.decayAngle = 90
fit.eloss = LISE
fit.iter = 100
fit.rounds = 2
fit.threads = 4

[sim lise]
eloss = LISE

[digi lise]

[sim srim]
eloss = SRIM

[digi srim]

[fit lise-lise]          ; <sim table>-<fit table>
input = lise

[fit srim-lise]
input = srim

[fit srim-srim]
input = srim
eloss = SRIM
