; Bias study: which part of the detector chain makes the fitted fragment Z biased. The same simulated events
; (the first chunks of tune_data90.ini's 90 deg sim, 0.25 mm steps) are digitized again at the data's fidelity
; (4000 diffusion points), changing one thing in how the pseudo-data is made, and fit with today's fit
; (100 iterations x 2 rounds, 1 mm step, 1000 points). Runs locally from copies of the sim chunks.
;   asis   the digitization as in tune_data90.ini (control)
;   resp   the measured response read per time bucket instead of per microsecond (digi.respTB)
;   qhits  hits made as the fit makes its own: nominal response, hits fit to the simulated charge, the fit's
;          PSA threshold; the beam-pad threshold scaled to the nominal response's larger pulses
[defaults]
digi.intPoints = 4000
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 1

[digi asis]
input = tune_data90-fine.sim.c0[0-1].root

[digi resp]
input = tune_data90-fine.sim.c0[0-3].root
respTB = 1

[digi qhits]
input = tune_data90-fine.sim.c0[0-3].root
respMeasured = 0
simChargeHits = 1
psaThreshold = 25
beamThreshold = 265

[fit asis]

[fit resp]

[fit qhits]
