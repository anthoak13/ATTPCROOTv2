; E3 of the fit tuning study: energy-loss tables in the data and in the fit, today's fit (iter 100 x
; rounds 2), first 30 chunks (1500 events) of each 90 deg data set. Sections are <data table>-<fit table>.
; Needs tune_data90.ini and tune_data90_srim.ini run first.
[defaults]
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit lise_lise]
input = tune_data90-fine.digi.c[0-2]?.root
eloss = LISE

[fit lise_srim]
input = tune_data90-fine.digi.c[0-2]?.root
eloss = SRIM

[fit srim_srim]
input = tune_data90_srim-fine.digi.c[0-2]?.root
eloss = SRIM

[fit srim_lise]
input = tune_data90_srim-fine.digi.c[0-2]?.root
eloss = LISE
