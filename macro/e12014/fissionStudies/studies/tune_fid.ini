; Phase A of the fit tuning study: the fit's own simulation fidelity, one knob at a time, at the
; iter 100 x rounds 2 search. Every section fits the same events (tune_data.ini, run it first).
; base2 repeats base with another seed: the floor of the paired columns of tune_report.py.
[defaults]
fit.input = tune_data:fine
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit base]

[fit base2]

[fit step05]
step = 0.5

[fit step2]
step = 2

[fit step3]
step = 3

[fit step4]
step = 4

[fit step6]
step = 6

[fit pts300]
intPoints = 300

[fit pts100]
intPoints = 100

[fit pts30]
intPoints = 30

[fit pts10]
intPoints = 10

[fit fix300]
fixedPattern = 1
intPoints = 300

[fit fix100]
fixedPattern = 1
intPoints = 100

[fit fix30]
fixedPattern = 1
intPoints = 30

[fit fix10]
fixedPattern = 1
intPoints = 10

[fit zs2]
zSigma = 2

[fit gain0]
gainFluct = 0
