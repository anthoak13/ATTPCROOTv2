; Angle extension of the fit tuning study: today's fit (iter 100 x rounds 2) on events whose decay angle is
; sampled from the measured distribution (tune_data.ini), while the fit assumes 90 deg. base2 repeats base
; with another seed. (First run as Phase A before the angle was fixed; its other sections were cancelled.)
[defaults]
fit.input = tune_data:fine
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit base]

[fit base2]

; E2: does more search shrink the error off 90 deg, or is it set by the 90 deg assumption? On the first 30
; chunks (1500 events), paired with base on those events.
[fit e40r2]
input = tune_data-fine.digi.c[0-2]?.root
iter = 40

[fit e400r2]
input = tune_data-fine.digi.c[0-2]?.root
iter = 400

[fit e200r3]
input = tune_data-fine.digi.c[0-2]?.root
iter = 200
rounds = 3
