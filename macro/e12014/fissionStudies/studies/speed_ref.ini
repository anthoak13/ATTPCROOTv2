;   ./fission.py studies/speed_ref.ini --remote hpc-ref --slurm
[defaults]
sim.events = 300
sim.chunks = 10
sim.massDev = 2
sim.decayAngle = 0
sim.zToSim = 50
sim.eloss = LISE

