; Thread scaling of the MC fitter: one 30-event digitization (chunk 0 of speed_ref.ini, which must be run first)
; fit with 1 to 64 threads, with the same events, settings and seed everywhere.
;
; The cluster's SLURM allocates whole cores (CR_CORE): --cpus-per-task=N gives N/2 physical cores with both SMT
; threads, so fit.threads = N runs two threads per core. Two arms separate that from the threading code:
;   t<N>   N threads as the driver normally submits them (N/2 cores, SMT shared)
;   t<N>n  the same with --hint=nomultithread (N whole cores, one thread per core)
;   p01-p16  sixteen single-thread fits at once, one core each: the control for hardware effects (turbo, shared
;            caches, memory) of a busy node, without any threading in the process
; The 16- to 64-thread sections add --exclusive so each runs alone on its node, one after another. An exclusive job
; can use every CPU of the node and its threads are not bound, so from 16 threads on the two arms are the same
; configuration. 50 threads divide fit.iter = 100 evenly; compare t50 with t64.
; The partition value is copied into the #SBATCH line, so it also pins each job to a node (--nodelist) and carries
; the extra options. Edit the node names for your cluster. At most about 200 CPUs are allocated at once.
; Outputs are named after this study, so to scan a second checkout that shares FISSION_DATA, run a copy of this file
; under another name. For the main thread's share, add copies of sections with fit.saveEvents = 0.
[defaults]
fit.input = speed_ref-ref.digi.c00.root
fit.iter = 100
fit.rounds = 2
fit.timeEvent = 1
fit.seed = 12345
fit.slurm.mem = 8G

; cnode1: the few-thread fits and the process control, together
[fit t1]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit t2]
threads = 2
slurm.partition = cs --nodelist=cnode1
[fit t4]
threads = 4
slurm.partition = cs --nodelist=cnode1
[fit t8]
threads = 8
slurm.partition = cs --nodelist=cnode1
[fit p01]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p02]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p03]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p04]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p05]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p06]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p07]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p08]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p09]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p10]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p11]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p12]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p13]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p14]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p15]
threads = 1
slurm.partition = cs --nodelist=cnode1
[fit p16]
threads = 1
slurm.partition = cs --nodelist=cnode1

; cnode2: exclusive, one after another
[fit t16]
threads = 16
slurm.mem = 16G
slurm.partition = cs --nodelist=cnode2 --exclusive
[fit t32]
threads = 32
slurm.mem = 32G
slurm.partition = cs --nodelist=cnode2 --exclusive
[fit t50]
threads = 50
slurm.mem = 50G
slurm.partition = cs --nodelist=cnode2 --exclusive
[fit t64]
threads = 64
slurm.mem = 64G
slurm.partition = cs --nodelist=cnode2 --exclusive

; one thread per core: t2n-t8n on cnode3, the rest exclusive on cnode2
[fit t2n]
threads = 2
slurm.partition = cs --nodelist=cnode3 --hint=nomultithread
[fit t4n]
threads = 4
slurm.partition = cs --nodelist=cnode3 --hint=nomultithread
[fit t8n]
threads = 8
slurm.partition = cs --nodelist=cnode3 --hint=nomultithread
[fit t16n]
threads = 16
slurm.mem = 16G
slurm.partition = cs --nodelist=cnode2 --hint=nomultithread --exclusive
[fit t32n]
threads = 32
slurm.mem = 32G
slurm.partition = cs --nodelist=cnode2 --hint=nomultithread --exclusive
[fit t50n]
threads = 50
slurm.mem = 50G
slurm.partition = cs --nodelist=cnode2 --hint=nomultithread --exclusive
[fit t64n]
threads = 64
slurm.mem = 64G
slurm.partition = cs --nodelist=cnode2 --hint=nomultithread --exclusive
