; A5 and A6 of the fit systematics study (syst_study/PLAN.md): the gas.
; Every sample digitizes syst_base.ini's base simulation again with the baseline's digi seed, with the electrons
; drifting and diffusing with a changed drift velocity or diffusion coefficient. The hits (PSA) and the fit use
; the parameter file's values, as the analysis of the experimental data does. The window stays at TBEntrance
; (457), so a changed drift velocity moves the pad plane in time. Recommended fit settings, baseline seeds.
;
; A5 vdm2, vdm1, vdp1, vdp2: drift velocity x 0.98, 0.99, 1.01, 1.02
; A6 tm20, tp20: transverse diffusion coefficient x 0.8, 1.2; lm20, lp20: longitudinal x 0.8, 1.2
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
digi.intPoints = 4000
digi.seed = 520000
digi.saveTraces = 0
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0
digi.input = syst_base:base

[digi vdm2]
driftVelocityScale = 0.98
[fit vdm2]

[digi vdm1]
driftVelocityScale = 0.99
[fit vdm1]

[digi vdp1]
driftVelocityScale = 1.01
[fit vdp1]

[digi vdp2]
driftVelocityScale = 1.02
[fit vdp2]

[digi tm20]
coefTScale = 0.8
[fit tm20]

[digi tp20]
coefTScale = 1.2
[fit tp20]

[digi lm20]
coefLScale = 0.8
[fit lm20]

[digi lp20]
coefLScale = 1.2
[fit lp20]
