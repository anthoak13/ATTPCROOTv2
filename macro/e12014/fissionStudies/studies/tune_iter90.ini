; Phase B of the fit tuning study: iterations x rounds at today's fit fidelity, on the first 30 chunks (1500
; events) of the 90 deg data (tune_data90.ini). b100x2 is today's search (the paired base), b100x2s the same
; with another seed (the chance-alone floor). fit.iter stays a multiple of fit.threads.
[defaults]
fit.input = tune_data90-fine.digi.c[0-2]?.root
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit b100x2]
iter = 100
rounds = 2

[fit b100x2s]
iter = 100
rounds = 2

[fit i40r1]
iter = 40
rounds = 1

[fit i100r1]
iter = 100
rounds = 1

[fit i200r1]
iter = 200
rounds = 1

[fit i20r2]
iter = 20
rounds = 2

[fit i40r2]
iter = 40
rounds = 2

[fit i60r2]
iter = 60
rounds = 2

[fit i200r2]
iter = 200
rounds = 2

[fit i400r2]
iter = 400
rounds = 2

[fit i20r3]
iter = 20
rounds = 3

[fit i40r3]
iter = 40
rounds = 3

[fit i100r3]
iter = 100
rounds = 3

[fit i200r3]
iter = 200
rounds = 3

; More rounds with fewer iterations: three rounds of 20 match two of 60 at half the simulations
[fit i12r3]
iter = 12
rounds = 3

[fit i12r4]
iter = 12
rounds = 4

[fit i20r4]
iter = 20
rounds = 4

; The fit's simulation at the data's fidelity (0.25 mm steps, 4000 diffusion points): how much of the core bias
; the fidelity mismatch causes. 10 chunks are enough for that; 20 threads keep a job near an hour.
[fit match]
input = tune_data90-fine.digi.c0?.root
iter = 100
rounds = 2
step = 0.25
intPoints = 4000
threads = 20
slurm.mem = 16G
