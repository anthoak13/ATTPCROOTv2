; Bias study: the decay angle measured from the beam's direction (sim.decayToBeam = 1), as the fit assumes,
; instead of from the z axis. Otherwise like tune_data90.ini (90 deg, heavy Z flat over 43-54, 0.25 mm steps,
; 4000 diffusion points), digitized with the response per time bucket, fit with today's fit. Runs locally.
[defaults]
sim.events = 200
sim.chunks = 4
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngle = 90
sim.eloss = LISE
sim.step = 0.25
sim.decayToBeam = 1
digi.intPoints = 4000
digi.respTB = 1
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 1

[sim beam]

[digi beam]

[fit beam]
