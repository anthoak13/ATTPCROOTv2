; A1-A4 of the fit systematics study (syst_study/PLAN.md): the beam's space charge.
; Every sample is syst_base.ini's base sample simulated again with the same seeds (3000 events, decay angle
; 80-100 deg, light-fragment Z 31-42, 0.25 mm, 4000 points) with a space charge in the simulation.
; Unless a section says otherwise, the hits are corrected as the experimental data are (line-charge model,
; lambda = 1.54e-8 C/m, beam line from (0, -6) at the pad plane to (10, 0) at the window), the Y-pattern is found
; in the corrected hits, and the fit simulates the same line charge. Recommended fit settings, baseline seeds.
;
; nom:         line charge of the nominal lambda in the data, about the line the correction assumes
; A1 half, double: data at lambda / 2 and 2 lambda, corrected and fitted with the nominal lambda;
;              half_m, double_m: the same data corrected and fitted with their own lambda
; A2 numeric:  the nominal line charge with the electrons' drift integrated step by step (they stop at the
;              20 mm beam radius instead of reaching the line)
;    uniform:  the charge spread uniformly over the 20 mm beam radius (field grows linearly inside it)
;    constant: the same total charge spread evenly in z (lambda / 2 everywhere) instead of growing toward the window
; A3 x5, y5:   the line charge 5 mm off the corrected line in x or y
;    simbeam:  the line charge along the simulated beam's mean track (eventSim.h): (18.29, -3.34) at the pad
;              plane, (-0.31, -9.04) at the window
; A4 nocorr:   the nom data, not corrected, Y-pattern from the distorted hits, fit without space charge
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
sim.spaceCharge = line
digi.intPoints = 4000
digi.seed = 520000
digi.saveTraces = 0
digi.scCorrection = 1
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0
fit.spaceCharge = 1

[sim nom]
[digi nom]
[fit nom]

; ---- A1: size ----
[sim half]
lambda = 0.77e-8
[digi half]
[fit half]

[digi half_m]
input = half
lambda = 0.77e-8
[fit half_m]

[sim double]
lambda = 3.08e-8
[digi double]
[fit double]

[digi double_m]
input = double
lambda = 3.08e-8
[fit double_m]

; ---- A2: shape ----
[sim numeric]
spaceCharge = lineNumeric
[digi numeric]
[fit numeric]

[sim uniform]
spaceCharge = uniform
[digi uniform]
[fit uniform]

[sim constant]
spaceCharge = constant
[digi constant]
[fit constant]

; ---- A3: beam position ----
[sim x5]
scBeam = 5 -6 15 0
[digi x5]
[fit x5]

[sim y5]
scBeam = 0 -1 10 5
[digi y5]
[fit y5]

[sim simbeam]
scBeam = 18.29 -3.34 -0.31 -9.04
[digi simbeam]
[fit simbeam]

; ---- A4: no correction ----
[digi nocorr]
input = nom
scCorrection = 0
[fit nocorr]
spaceCharge = 0
