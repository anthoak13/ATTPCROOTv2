; B1 of the fit systematics study (syst_study/PLAN.md), third model: the Ziegler stopping powers (the Ziegler
; column of the LISE files, as in older SRIM versions) against LISE (the ATIMA column). Sample as
; syst_eloss.ini's: syst_base.ini's base sample simulated again with the same seeds. The beam keeps LISE. Recommended fit settings, baseline seeds.
;
; zieg_lise: Ziegler data fitted with LISE; zieg_zieg: fitted with Ziegler;
; lise_zieg: the baseline's LISE data fitted with Ziegler
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
digi.intPoints = 4000
digi.seed = 520000
digi.saveTraces = 0
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0

[sim zieg]
eloss = ZIEGLER
beamEloss = LISE
[digi zieg]

[fit zieg_lise]
input = zieg
eloss = LISE

[fit zieg_zieg]
input = zieg
eloss = ZIEGLER

[fit lise_zieg]
input = syst_base:base
eloss = ZIEGLER
