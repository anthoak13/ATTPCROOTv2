; The tuning study's key settings again, on correctly digitized data (tune_rdata90.ini, run it first). Every
; section is compared event by event with base (today's fit: 100 x 2, 1 mm step, 1000 random diffusion points).
; Most search lengths use the first 30 chunks (1500 events); 60 x 2 and 40 x 3 use all 60. base2 repeats base
; with another seed.
[defaults]
fit.input = tune_rdata90:fine
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit base]

[fit base2]

[fit step2]
step = 2

[fit step4]
step = 4

[fit pts300]
intPoints = 300

[fit pts100]
intPoints = 100

[fit pat100]
fixedPattern = 1
intPoints = 100

[fit pat30]
fixedPattern = 1
intPoints = 30

[fit zs2]
zSigma = 2

[fit gain0]
gainFluct = 0

[fit comb4]
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb1]
step = 2
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb4s]
iter = 20
rounds = 3
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb1s]
iter = 20
rounds = 3
step = 2
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit i200r2]
input = tune_rdata90-fine.digi.c[0-2]?.root
iter = 200
rounds = 2

[fit i60r2]
iter = 60
rounds = 2

[fit i40r2]
input = tune_rdata90-fine.digi.c[0-2]?.root
iter = 40
rounds = 2

[fit i40r3]
iter = 40
rounds = 3

[fit i20r3]
input = tune_rdata90-fine.digi.c[0-2]?.root
iter = 20
rounds = 3

[fit i12r3]
input = tune_rdata90-fine.digi.c[0-2]?.root
iter = 12
rounds = 3

; The combined settings with the shorter searches that keep the fit's accuracy on their own
[fit comb4i60r2]
iter = 60
rounds = 2
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb4i40r3]
iter = 40
rounds = 3
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb1i40r3]
iter = 40
rounds = 3
step = 2
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0
