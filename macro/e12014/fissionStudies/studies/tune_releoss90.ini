; Energy-loss tables in the data and in the fit, today's fit (100 x 2), on correctly digitized 90 deg data: the
; first 30 chunks (1500 events) of tune_rdata90.ini (LISE) and tune_rdata90_srim.ini (SRIM). Sections are
; <data table>_<fit table>. Run both data studies first.
[defaults]
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit lise_lise]
input = tune_rdata90-fine.digi.c[0-2]?.root
eloss = LISE

[fit lise_srim]
input = tune_rdata90-fine.digi.c[0-2]?.root
eloss = SRIM

[fit srim_srim]
input = tune_rdata90_srim-fine.digi.c[0-2]?.root
eloss = SRIM

[fit srim_lise]
input = tune_rdata90_srim-fine.digi.c[0-2]?.root
eloss = LISE
