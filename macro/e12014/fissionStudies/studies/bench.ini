[study]
question = How does fit time scale with fit.threads? Fixed events and seed, timing per event in the fit log.
result   =

[defaults]
events = 20
seed = 12345
sim.zToSim = 50
sim.massDev = 0
sim.decayAngle = 90
sim.eloss = LISE
fit.eloss = LISE
fit.iter = 100
fit.rounds = 2
fit.timeEvent = 1

[run t1]
fit.threads = 1

[run t2]
upstream = t1
fit.threads = 2

[run t4]
upstream = t1
fit.threads = 4

[run t8]
upstream = t1
fit.threads = 8
