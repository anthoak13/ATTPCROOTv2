; C2, C3 and C5 of the fit systematics study (syst_study/PLAN.md): the reaction's kinematics.
; Every sample is syst_base.ini's base sample simulated again with the same seeds (3000 events, decay angle
; 80-100 deg, light-fragment Z 31-42, 0.25 mm, 4000 points) and one change to the kinematics; the fit assumes
; Viola's total kinetic energy (TKE), A = round(204 Z / 85) and takes the directions from the Y-pattern.
; Recommended fit settings, baseline seeds.
;
; C2 tke098, tke102: TKE x 0.98 and 1.02; tkesig: TKE spread by 8% (sigma) around Viola
; C3 am1, ap1: the light fragment's A shifted by -1 and +1 (the heavy one's by the opposite)
; C5 spot2: the beam spot's spread x 2; div3: the beam direction's spread x 3 (2.2 to 6.6 mrad);
;    tilt10: the beam's mean direction tilted by 10 mrad in x
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
digi.intPoints = 4000
digi.seed = 520000
digi.saveTraces = 0
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0


[sim tke098]
tkeScale = 0.98
[digi tke098]
[fit tke098]

[sim tke102]
tkeScale = 1.02
[digi tke102]
[fit tke102]

[sim tkesig]
tkeSigma = 0.08
[digi tkesig]
[fit tkesig]

[sim am1]
massShift = -1
[digi am1]
[fit am1]

[sim ap1]
massShift = 1
[digi ap1]
[fit ap1]

[sim spot2]
beamSpotScale = 2
[digi spot2]
[fit spot2]

[sim div3]
beamDivScale = 3
[digi div3]
[fit div3]

[sim tilt10]
beamTiltX = 10
[digi tilt10]
[fit tilt10]
