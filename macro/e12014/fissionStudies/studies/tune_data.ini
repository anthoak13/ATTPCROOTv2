; Pseudo-data of the fit tuning study, made once and fit by every tune_*.ini study.
; Finer than any fit setting tried (0.25 mm steps, 4000 diffusion points per line), so no fit
; setting matches the data's ionization and diffusion model exactly, as with real data.
; The heavy fragment's Z is flat over 43-54 (light fragment 42-31), one exact split per event.
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngle = 0
sim.eloss = LISE
sim.step = 0.25
digi.intPoints = 4000

