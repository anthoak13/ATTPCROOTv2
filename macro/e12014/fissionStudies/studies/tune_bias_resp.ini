; Bias study: tune_data90.ini's 90 deg events (3000, 0.25 mm steps) digitized again with the measured response
; read per time bucket (digi.respTB = 1) instead of per microsecond, otherwise as tune_data90.ini, and fit with
; today's fit (100 iterations x 2 rounds, 1 mm step, 1000 diffusion points). Compare with tune_fid90.ini's base.
[defaults]
digi.input = tune_data90:fine
digi.intPoints = 4000
digi.respTB = 1
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[digi fix]

[fit base]
input = fix

; The fit at the data's own fidelity (0.25 mm steps, 4000 diffusion points), first 10 chunks (500 events)
[fit match]
input = tune_bias_resp-fix.digi.c0?.root
step = 0.25
intPoints = 4000
threads = 20
slurm.mem = 16G
