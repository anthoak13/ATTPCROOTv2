; C4 of the fit systematics study (syst_study/PLAN.md): the mass unit of the simulation. Until sim.massUnit
; existed, the simulation used 939.0 MeV per mass unit and the fit 931.5. The same 1000 events (same seeds)
; are simulated at both and fitted with the recommended settings; the fit always uses 931.5.
; Sample as syst_base.ini's base: decay angle 80-100 deg, light-fragment Z 31-42, 0.25 mm, 4000 points.
[defaults]
sim.events = 1000
sim.chunks = 20
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 610000
digi.intPoints = 4000
digi.seed = 620000
fit.seed = 630000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0

[sim mu931]
massUnit = 931.5

[digi mu931]

[fit mu931]

[sim mu939]
massUnit = 939

[digi mu939]

[fit mu939]
