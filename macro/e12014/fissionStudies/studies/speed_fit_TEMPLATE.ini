; Fits of one code variant for the speed study. Copy to speed_fit_<variant>.ini (letters, digits and _),
; e.g. cp speed_fit_TEMPLATE.ini speed_fit_v1.ini, and run it on that variant's checkout:
;   ./fission.py studies/speed_fit_v1.ini --remote speed-v1 --slurm
; Keep the settings identical to speed_fit_ref.ini so the variants differ only in code and in the seed, which the
; driver derives from the study and section names (set fit.seed to compare fits bit for bit).
[defaults]
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.timeEvent = 1

[fit a]
input = speed_ref:ref

[fit b]
input = speed_ref:ref
