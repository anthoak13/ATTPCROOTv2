; Pseudo-data of the fit tuning study at a fixed 90 deg decay angle (the angle the fit assumes), made once
; and fit by every tuning configuration (tune_fid90.ini and later). Away from 90 deg the fit fails for reasons
; unrelated to the settings being tuned, so the angle is held at 90 deg here and studied separately
; (tune_data.ini, sampled angles). Finer than any fit setting tried (0.25 mm steps, 4000 diffusion points per
; line). The heavy fragment Z is flat over 43-54 (light fragment 42-31), one exact split per event.
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngle = 90
sim.eloss = LISE
sim.step = 0.25
digi.intPoints = 4000

[sim fine]

[digi fine]
