; Reference fit of the speed study. Fit a is the reference sample of the physics gate, fit b the same
; fit again: they differ only by the seed the driver derives for each, so the difference between them is the
; run-to-run spread.
; Variants use a copy of speed_fit_TEMPLATE.ini. Needs speed_ref.ini run first.
[defaults]
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.timeEvent = 1

[fit a]
input = speed_ref:ref

[fit b]
input = speed_ref:ref
