; E3 of the fit tuning study: the 90 deg pseudo-data of tune_data90.ini again, with SRIM fragment tables
; (the beam keeps LISE: there is no SRIM beam table). Same seeds, so each event starts identical (beam,
; vertex, split, directions); its tracks then follow the other table, and the trigger can keep a different
; event, so events are compared as distributions, not paired across the two data sets.
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngle = 90
sim.eloss = SRIM
sim.beamEloss = LISE
sim.step = 0.25
sim.seed = 1426118280
digi.seed = 846969369
digi.intPoints = 4000

[sim fine]

[digi fine]
