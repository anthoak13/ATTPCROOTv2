; Phase A of the fit tuning study: the fit's own simulation fidelity, one knob at a time, at the iter 100 x
; rounds 2 search. Every section fits the same 90 deg events (tune_data90.ini, run it first).
; base2 repeats base with another seed: the floor of the paired columns of tune_report.py.
[defaults]
fit.input = tune_data90:fine
fit.iter = 100
fit.rounds = 2
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1

[fit base]

[fit base2]

[fit step05]
step = 0.5

[fit step2]
step = 2

[fit step3]
step = 3

[fit step4]
step = 4

[fit step6]
step = 6

[fit pts300]
intPoints = 300

[fit pts100]
intPoints = 100

[fit pts30]
intPoints = 30

[fit pts10]
intPoints = 10

[fit pat300]
fixedPattern = 1
intPoints = 300

[fit pat100]
fixedPattern = 1
intPoints = 100

[fit pat30]
fixedPattern = 1
intPoints = 30

[fit pat10]
fixedPattern = 1
intPoints = 10

[fit zs2]
zSigma = 2

[fit gain0]
gainFluct = 0

; Combined settings: the cheapest setting with no measurable effect of each kind together (comb1), then
; one kind one step further (comb2: 3 mm step, comb3: 30 pattern points)
[fit comb1]
step = 2
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb2]
step = 3
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb3]
step = 2
fixedPattern = 1
intPoints = 30
zSigma = 2
gainFluct = 0

; The combined settings at a 20 x 3 search (comb1s), and without the 2 mm step (comb4: 1 mm step, 100 pattern
; points, +-2 sigma, no gain fluctuations) at 100 x 2 and at 20 x 3
[fit comb1s]
iter = 20
rounds = 3
step = 2
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb4]
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0

[fit comb4s]
iter = 20
rounds = 3
fixedPattern = 1
intPoints = 100
zSigma = 2
gainFluct = 0
