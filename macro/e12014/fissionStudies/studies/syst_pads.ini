; D1, D3 and D4 of the fit systematics study (syst_study/PLAN.md): pads, gains and electronics.
; Every sample digitizes syst_base.ini's base simulation again with the baseline's digi seed and one change;
; the fit is not told about it. Recommended fit settings, baseline seeds.
;
; D1 dead pads (no charge). The fit can use 5553 small pads (not low-gain); the dead AsAd (CoBo 2, AsAd 3, as in
;    the experimental data) holds 182 of them. Further dead pads are drawn from the same 5553 pads, scattered
;    (patch 1) or in patches of 16 neighboring pads, 2%, 5% and 10% of them (111, 278, 555; patches 112, 272, 560).
;    asad: the AsAd only; asad_sNN: plus NN% scattered; asad_pNN: plus NN% in patches
; D3 gains: a fixed factor per pad (pad5, pad10: sigma 5%, 10%), per AGET (aget5, aget10) or per AsAd (asad5, asad10)
; D4 noise: Gaussian noise of 5 (nominal) and 10 ADC on every sample of every trace with charge
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
digi.intPoints = 4000
digi.seed = 520000
digi.saveTraces = 0
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0
digi.input = syst_base:base

[digi asad]
deadAsAd = 2 3
[fit asad]

[digi asad_s02]
deadAsAd = 2 3
deadPads = 111
[fit asad_s02]

[digi asad_s05]
deadAsAd = 2 3
deadPads = 278
[fit asad_s05]

[digi asad_s10]
deadAsAd = 2 3
deadPads = 555
[fit asad_s10]

[digi asad_p02]
deadAsAd = 2 3
deadPads = 112
deadPatch = 16
[fit asad_p02]

[digi asad_p05]
deadAsAd = 2 3
deadPads = 272
deadPatch = 16
[fit asad_p05]

[digi asad_p10]
deadAsAd = 2 3
deadPads = 560
deadPatch = 16
[fit asad_p10]

[digi pad5]
padGainSigma = 0.05
[fit pad5]

[digi pad10]
padGainSigma = 0.10
[fit pad10]

[digi aget5]
agetGainSigma = 0.05
[fit aget5]

[digi aget10]
agetGainSigma = 0.10
[fit aget10]

[digi asad5]
asadGainSigma = 0.05
[fit asad5]

[digi asad10]
asadGainSigma = 0.10
[fit asad10]

[digi noise5]
noise = 5
[fit noise5]

[digi noise10]
noise = 10
[fit noise10]
