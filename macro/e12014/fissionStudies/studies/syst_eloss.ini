; B1 and B2 of the fit systematics study (syst_study/PLAN.md): the fragments' stopping power.
; Every sample is syst_base.ini's base sample simulated again with the same seeds (3000 events, decay angle
; 80-100 deg, light-fragment Z 31-42, 0.25 mm, 4000 points) and one change to the fragments' energy loss.
; Every fit uses the recommended settings and syst_base.ini's fit seed.
;
; B2: every fragment's dE/dx scaled in the simulation (LISE), fitted with LISE.
; B1: SRIM data fitted with LISE and with SRIM; the LISE baseline data fitted with SRIM. The beam keeps
;   LISE (there is no SRIM beam table).
[defaults]
sim.events = 3000
sim.chunks = 60
sim.zToSim = 43
sim.zToSimMax = 54
sim.massDev = 0
sim.decayAngleMin = 80
sim.decayAngleMax = 100
sim.eloss = LISE
sim.step = 0.25
sim.seed = 510000
digi.intPoints = 4000
digi.seed = 520000
digi.saveTraces = 0
fit.seed = 530000
fit.threads = 4
fit.saveEvents = 0
fit.timeEvent = 1
fit.iter = 40
fit.rounds = 3
fit.step = 2
fit.fixedPattern = 1
fit.intPoints = 100
fit.zSigma = 2
fit.gainFluct = 0

; ---- B2: dE/dx scale ----
[sim s095]
elossScale = 0.95
[digi s095]
[fit s095]

[sim s098]
elossScale = 0.98
[digi s098]
[fit s098]

[sim s102]
elossScale = 1.02
[digi s102]
[fit s102]

[sim s105]
elossScale = 1.05
[digi s105]
[fit s105]

; ---- B1: LISE against SRIM ----
[sim srim]
eloss = SRIM
beamEloss = LISE
[digi srim]

[fit srim_lise]
input = srim
eloss = LISE

[fit srim_srim]
input = srim
eloss = SRIM

[fit lise_srim]
input = syst_base:base
eloss = SRIM
