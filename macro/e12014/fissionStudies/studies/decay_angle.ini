; Rebuilt from ../skyler/plots_pdf/Angle_90, Angle_120 and ../skyler/NOTES.md. Original settings are approximate.
[study]
question = How much does fixing the CoM decay angle improve the Z resolution?
result   = sigma(Ztrue - Zfit) = 0.17 at both 90 and 120 deg (original runs 3 and 4)

[defaults]
events = 500
sim.zToSim = 50
sim.massDev = 0
sim.eloss = LISE
fit.eloss = LISE
fit.iter = 100
fit.rounds = 2
fit.threads = 4

[run 90deg]
sim.decayAngle = 90

[run 120deg]
sim.decayAngle = 120
